[package]
name = "sentinel-key"
version = "0.1.0"
edition = "2024"
description = "Encrypted USB presence key for Sentinel"
license = "MIT"

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
