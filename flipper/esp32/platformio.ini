[platformio]
default_envs = esp32dev

; Classic ESP32 dev board wired to the Flipper's GPIO header.
; Flipper 13 (TX) -> ESP32 GPIO3 (RX0)
; Flipper 14 (RX) -> ESP32 GPIO1 (TX0)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Official Flipper WiFi Devboard (ESP32-S2-WROVER, 4 MB flash / 2 MB PSRAM).
; The board wires UART0 to the header: GPIO44 = RX, GPIO43 = TX.
[env:esp32s2]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DSENTINEL_ESP32S2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
