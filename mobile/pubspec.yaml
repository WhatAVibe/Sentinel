name: sentinel
description: "Sentinel remote control for your own PC."
publish_to: 'none'
version: 1.2.3+8

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  provider: ^6.1.0
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.0
  local_auth: ^3.0.2
  mobile_scanner: ^7.0.1
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  crypto: ^3.0.0
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
